name: Forward Port

on:
  push:
    branches:
      - master
      - release

permissions:
  contents: write
  pull-requests: write

jobs:
  forward-port:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create forward-port branch and pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          commit_message="$(git log -1 --format=%B "$SOURCE_SHA")"
          if [[ ! "$commit_message" =~ forward-port:[[:space:]]*([^[:space:]]+) ]]; then
            echo "No forward-port directive found."
            exit 0
          fi

          target_branch="${BASH_REMATCH[1]}"
          commit_subject="$(git log -1 --format=%s "$SOURCE_SHA")"
          pr_title="$(printf '%s\n' "$commit_subject" | sed -E 's/[[:space:]]+forward-port:[[:space:]]*[^[:space:]]+[[:space:]]*$//')"
          if [[ -z "$pr_title" ]]; then
            pr_title="Forward-port $SOURCE_SHA"
          fi

          if ! git check-ref-format --branch "$target_branch" >/dev/null; then
            echo "Invalid target branch: $target_branch" >&2
            exit 1
          fi

          forward_branch="forward-port/${target_branch//\//-}/${SOURCE_SHA:0:12}"
          git push origin "$SOURCE_SHA:refs/heads/$forward_branch"

          existing_pr="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$forward_branch" \
            --base "$target_branch" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$existing_pr" ]]; then
            echo "Pull request #$existing_pr already exists."
            exit 0
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$target_branch" \
            --head "$forward_branch" \
            --title "$pr_title" \
            --body "Forward-port of commit $SOURCE_SHA from $SOURCE_BRANCH to $target_branch."
